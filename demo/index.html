    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cybercore CSS" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Cybercore CSS: Cyberpunk UI in pure CSS" />
    <meta property="og:description" content="Cybercore CSS is a pure CSS cyberpunk design system: neon components, glitch effects, design tokens and 150+ SVG icons. No JavaScript, works with any framework." />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- The same font link the install guide prints (src/site.ts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="%FONTS_HREF%" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Cybercore CSS",
        "description": "A pure CSS cyberpunk design system: neon components, glitch effects, design tokens and SVG icons. No JavaScript.",
        "url": "https://sebyx07.github.io/cybercore-css/",
        "codeRepository": "https://github.com/sebyx07/cybercore-css",
        "programmingLanguage": ["CSS", "SCSS"],
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Person", "name": "sebyx07", "url": "https://github.com/sebyx07" }
      }
    </script>

    <script>
      // Apply the saved theme before first paint.
      try {
        var theme = localStorage.getItem('cybercore-theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 4rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; color: #f0f1f5">
        <h1>Cybercore CSS</h1>
        <p>A pure CSS cyberpunk design system. The framework needs no JavaScript. This documentation site does.</p>
        <p>
          <a href="https://github.com/sebyx07/cybercore-css#readme" style="color: #00f0ff">Read the docs on GitHub</a> or install with
          <code>npm install cybercore-css</code>.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
